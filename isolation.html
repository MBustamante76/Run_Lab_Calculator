<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme isolation check</title>
    <style>
      /* Development only. This page is not part of the WordPress plugin. */
      body {
        margin: 0;
        background: #ff00aa;
      }

      h1,
      h2,
      h3 {
        color: #ff00aa;
        font-size: 12px;
        letter-spacing: 0;
        text-transform: none;
      }

      button {
        min-height: 10px;
        padding: 0;
        color: #00ff00;
        font-family: "Comic Sans MS", cursive;
        letter-spacing: 0;
        text-transform: none;
        background: #ff00aa;
        border-radius: 0;
      }

      input,
      select {
        width: 40px;
        color: #00ff00;
        font-family: "Comic Sans MS", cursive;
        background: #ff00aa;
        border: 4px solid #ff00aa;
      }

      p,
      label,
      legend {
        color: #ff00aa;
        font-size: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Host site heading</h1>
      <button type="button">Host button</button>
